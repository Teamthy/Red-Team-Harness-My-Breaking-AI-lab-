target:
  name: ncd-guideline-tutor-stream
  attestation: "I own this system or have written permission to test it."
  type: http
  base_url: https://api.example.com
  path: /api/chat/stream
  method: POST
  stream: true
  response_mode: sse
  body_template: '{"question": "{prompt}", "history": []}'
  headers:
    Authorization: "Bearer {API_KEY}"
    Content-Type: application/json
  timeout: 60.0
  sse:
    event_field: data
    status_field: done
    text_field: content
options:
  k: 1
  judge_enabled: false
  layers:
    - injection
    - exfiltration
    - citation
