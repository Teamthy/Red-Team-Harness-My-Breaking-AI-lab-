target:
  name: fastapi-chat-json
  attestation: "I own this system or have written permission to test it."
  type: http
  base_url: http://127.0.0.1:8000
  path: /chat
  method: POST
  body_template: |
    {
      "question": "{prompt}",
      "history": [],
      "stream": false
    }
  headers:
    Content-Type: application/json
  timeout: 30.0
options:
  k: 1
  judge_enabled: false
  layers:
    - injection
    - exfiltration
    - policy
