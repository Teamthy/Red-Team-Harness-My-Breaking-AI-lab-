name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        run: |
          breaklab verify --target mock://fixed
          breaklab verify --target python://breaklab.example_local_target:safe_echo_target
          breaklab diff artifacts/20261012T013253Z-mock_broken.jsonl artifacts/20261012T013302Z-mock_fixed.jsonl -o /tmp/mock_diff.md
          test -s /tmp/mock_diff.md
